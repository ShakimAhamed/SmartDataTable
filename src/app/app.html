<div class="p-6 max-w-5xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">Smart Data Table</h1>

  <!-- Search -->
  <input
    type="text"
    placeholder="Search user..."
    (input)="onFilter($any($event.target).value)"
    class="border p-2 mb-4 w-full rounded"
  />

  <!-- Header -->
  <div class="grid grid-cols-3 bg-gray-100 p-2 font-semibold">
    <div (click)="sort('id')" class="cursor-pointer">ID</div>
    <div (click)="sort('name')" class="cursor-pointer">Name</div>
    <div (click)="sort('value')" class="cursor-pointer">Value</div>
  </div>

  <!-- Virtual Scroll -->
  <cdk-virtual-scroll-viewport
    itemSize="50"
    class="h-[400px] border"
  >
    <div
      *cdkVirtualFor="let item of data(); trackBy: trackById"
      class="grid grid-cols-3 p-2 border-b hover:bg-gray-50"
    >
      <div>{{ item.id }}</div>
      <div>{{ item.name }}</div>
      <div>{{ item.value }}</div>
    </div>
  </cdk-virtual-scroll-viewport>

  <!-- Pagination -->
  <div class="flex justify-between mt-4">
    <button (click)="prevPage()" class="px-4 py-2 bg-gray-200 rounded">
      Prev
    </button>
    <button (click)="nextPage()" class="px-4 py-2 bg-gray-200 rounded">
      Next
    </button>
  </div>
</div>
